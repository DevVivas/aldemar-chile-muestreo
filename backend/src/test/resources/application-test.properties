# Perfil "test": base H2 en memoria, así ./mvnw test y ./mvnw package funcionan sin MySQL.
spring.datasource.url=jdbc:h2:mem:aquasample;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Se crea el esquema al iniciar y se borra al terminar.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Contraseñas SOLO para los tests (no son las de .env).
DEMO_PASSWORD_OPERARIO=test-operario
DEMO_PASSWORD_SUPERVISOR=test-supervisor
DEMO_PASSWORD_ANALISTA=test-analista

app.fotos.dir=target/test-uploads
