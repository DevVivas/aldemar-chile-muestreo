spring.application.name=aquasample
server.port=8080

# --- Base de datos (MySQL) ---
# Los valores vienen de variables de entorno; lo que va después de ":" es el valor por defecto.
# La contraseña NO tiene valor por defecto: hay que definir DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aquasample}
spring.datasource.username=${DB_USER:aquasample}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# update: crea o ajusta las tablas según las entidades (cómodo en desarrollo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Santiago

# --- Fotos ---
# Carpeta donde se guardan las fotos subidas (relativa a donde se ejecuta el backend).
app.fotos.dir=${FOTOS_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Usuarios demo ---
# Las contraseñas se leen de DEMO_PASSWORD_OPERARIO / _SUPERVISOR / _ANALISTA (archivo .env).
# Solo se usan la primera vez, cuando la tabla usuarios está vacía.

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
