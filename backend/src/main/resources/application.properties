spring.application.name=aquasample
server.port=8080

# --- Base de datos (MySQL) ---
# Los valores vienen de variables de entorno; lo que va después de ":" es el valor por defecto.
# La contraseña NO tiene valor por defecto: hay que definir DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aquasample}
spring.datasource.username=${DB_USER:aquasample}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# update: crea o ajusta las tablas según las entidades (cómodo en desarrollo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Santiago

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
